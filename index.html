<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hudson Schooling Corporation Virtual LMS Version 2.0</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<style>
:root{
    --primary:#0A4DBA;
    --accent:#A4E0C5;
    --dark:#0F1729;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
        url("HSC VLMS Background.jpg");
    background-size:cover;
    background-position:center;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:70px;
    height:70px;
    border-radius:12px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:var(--primary);
    color:white;
    font-weight:600;
}

.container{
    padding:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:20px;
}

.card h2{
    color:var(--accent);
    margin-bottom:15px;
}

.item{
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    background:rgba(255,255,255,.05);
    cursor:pointer;
}

.item:hover{
    background:rgba(255,255,255,.12);
}

.status{
    margin-top:10px;
    color:var(--accent);
}
</style>
</head>

<body>

<header>

<div class="logo">
    <img src="HSC Logo.jpg" alt="HSC Logo">
    <div>
        <h2>Hudson Schooling Corporation</h2>
        <div>Virtual LMS Version 2.0</div>
    </div>
</div>

<div>
    <button id="loginBtn">Google Sign-In</button>
    <button id="logoutBtn">Logout</button>
</div>

</header>

<div class="container">

<div class="card">
    <h2>Connection Status</h2>
    <div id="status">Not Connected</div>
</div>

<br>

<div class="grid">

<div class="card">
    <h2>Courses</h2>
    <div id="coursesContainer">
        No courses loaded.
    </div>
</div>

<div class="card">
    <h2>Assignments</h2>
    <div id="assignmentsContainer">
        Select a course.
    </div>
</div>

<div class="card">
    <h2>Announcements</h2>
    <div id="announcementsContainer">
        Select a course.
    </div>
</div>

<div class="card">
    <h2>Gradebook</h2>
    <div id="gradebookContainer">
        Select a course.
    </div>
</div>

</div>

</div>

<script>

/* ==========================
   GOOGLE CLASSROOM CONFIG
   ========================== */

const CLIENT_ID =
"693328102745-2fkq8hbpbr2lr2qiknoib7mbc10l7q0c.apps.googleusercontent.com";

const API_KEY =
"AIzaSyC_IllJCmaScgDcXtR7WYTklpwBzJddQzs";

const DISCOVERY_DOC =
"https://classroom.googleapis.com/$discovery/rest?version=v1";

const SCOPES = [
"https://www.googleapis.com/auth/classroom.courses.readonly",
"https://www.googleapis.com/auth/classroom.coursework.me.readonly",
"https://www.googleapis.com/auth/classroom.student-submissions.me.readonly",
"https://www.googleapis.com/auth/classroom.announcements.readonly"
].join(" ");

let tokenClient;

/* ==========================
   INITIALIZE API
   ========================== */

gapi.load("client", async () => {

    await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: [DISCOVERY_DOC]
    });

});

/* ==========================
   AUTH
   ========================== */

window.addEventListener("load", () => {

    tokenClient =
    google.accounts.oauth2.initTokenClient({

        client_id: CLIENT_ID,

        scope: SCOPES,

        callback: async (response) => {

            if(response.error){
                console.error(response);
                return;
            }

            document.getElementById("status")
            .innerText =
            "Connected to Google Classroom";

            loadCourses();

        }

    });

});

document.getElementById("loginBtn")
.addEventListener("click", () => {

    tokenClient.requestAccessToken();

});

document.getElementById("logoutBtn")
.addEventListener("click", () => {

    const token = gapi.client.getToken();

    if(token){

        google.accounts.oauth2.revoke(
            token.access_token
        );

        gapi.client.setToken("");

        location.reload();

    }

});

/* ==========================
   COURSES
   ========================== */

async function loadCourses(){

    try{

        const response =
        await gapi.client.classroom
        .courses.list();

        const courses =
        response.result.courses || [];

        const container =
        document.getElementById(
            "coursesContainer"
        );

        container.innerHTML = "";

        courses.forEach(course => {

            const div =
            document.createElement("div");

            div.className = "item";

            div.innerHTML =
            `<strong>${course.name}</strong>`;

            div.onclick = () => {

                loadAssignments(course.id);
                loadAnnouncements(course.id);
                loadGrades(course.id);

            };

            container.appendChild(div);

        });

    }catch(error){

        console.error(error);

    }

}

/* ==========================
   ASSIGNMENTS
   ========================== */

async function loadAssignments(courseId){

    const container =
    document.getElementById(
        "assignmentsContainer"
    );

    container.innerHTML = "";

    try{

        const response =
        await gapi.client.classroom
        .courses.courseWork.list({
            courseId
        });

        const assignments =
        response.result.courseWork || [];

        assignments.forEach(item => {

            container.innerHTML += `
            <div class="item">
                <strong>${item.title}</strong><br>
                ${item.description || ""}
                <br><br>
                <button onclick="window.open('${item.alternateLink}','_blank')">
                    Open Assignment
                </button>
            </div>
            `;

        });

    }catch(error){

        console.error(error);

    }

}

/* ==========================
   ANNOUNCEMENTS
   ========================== */

async function loadAnnouncements(courseId){

    const container =
    document.getElementById(
        "announcementsContainer"
    );

    container.innerHTML = "";

    try{

        const response =
        await gapi.client.classroom
        .courses.announcements.list({
            courseId
        });

        const announcements =
        response.result.announcements || [];

        announcements.forEach(item => {

            container.innerHTML += `
            <div class="item">
                ${item.text || "Announcement"}
            </div>
            `;

        });

    }catch(error){

        console.error(error);

    }

}

/* ==========================
   GRADEBOOK
   ========================== */

async function loadGrades(courseId){

    const container =
    document.getElementById(
        "gradebookContainer"
    );

    container.innerHTML = "";

    try{

        const workResponse =
        await gapi.client.classroom
        .courses.courseWork.list({
            courseId
        });

        const coursework =
        workResponse.result.courseWork || [];

        for(const work of coursework){

            try{

                const submissions =
                await gapi.client.classroom
                .courses.courseWork
                .studentSubmissions.list({

                    courseId,
                    courseWorkId: work.id

                });

                const list =
                submissions.result
                .studentSubmissions || [];

                list.forEach(sub => {

                    container.innerHTML += `
                    <div class="item">
                        <strong>${work.title}</strong><br>
                        Grade:
                        ${sub.assignedGrade ?? "Not Graded"}
                    </div>
                    `;

                });

            }catch(err){

                console.error(err);

            }

        }

    }catch(error){

        console.error(error);

    }

}

</script>

</body>
</html>
